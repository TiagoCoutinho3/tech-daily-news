name: generate-posts

on:
  workflow_dispatch: # Execução manual via interface do GitHub

  # Exemplo de trigger automático para disparar após o término com sucesso do fetch-news
  # (Descomente quando desejar automatizar o pipeline completo de ponta a ponta)
  # workflow_run:
  #   workflows: ["fetch-news"]
  #   types:
  #     - completed

permissions:
  contents: write # Necessário para commit e push automático do data/posts.json

jobs:
  generate:
    # Descomente a linha abaixo se usar o trigger workflow_run para rodar apenas se o fetch-news foi concluído com sucesso:
    # if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    env:
      OLLAMA_MODEL: "batiai/gemma4-e4b:q4"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-gemma4-e4b-q4-v1

      - name: Instalar Ollama no runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Iniciar servidor Ollama e aguardar prontidão
        run: |
          ollama serve &
          # Aguardar inicialização do serviço Ollama (até 30 segundos)
          for i in $(seq 1 15); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama iniciado e pronto para conexões."
              break
            fi
            echo "Aguardando inicialização do Ollama ($i)..."
            sleep 2
          done

      - name: Baixar modelo local de IA (${{ env.OLLAMA_MODEL }})
        run: |
          ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Gerar posts e reações dos bots
        run: |
          python scripts/generate_posts.py

      - name: Commitar e salvar posts.json no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-generate AI posts and bot reactions [skip ci]"
          file_pattern: "data/posts.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
